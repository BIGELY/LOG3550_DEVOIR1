<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue de bibliothèque</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header>
        <h1>Catalogue de Bibliothèque</h1>

        <nav aria-label="Navigation principale">
            <ul>
                <li><a href="#catalogue">Catalogue</a></li>
                <li><a href="#ajout">Ajouter un livre</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section id="catalogue">
            <h2>Catalogue des livres</h2>

            <p>Consultez les livres disponibles dans notre bibliothèque.</p>

<div id="filtres">

    <div>
        <label for="recherche">Rechercher un livre :</label>
        <input
            type="search"
            id="recherche"
            placeholder="Titre ou auteur..."
        >
    </div>

    <div>
        <label for="filtre-categorie">Catégorie :</label>
        <select id="filtre-categorie">
            <option value="">Toutes les catégories</option>
            <option value="roman">Roman</option>
            <option value="science">Science</option>
            <option value="histoire">Histoire</option>
            <option value="informatique">Informatique</option>
            <option value="autre">Autre</option>
        </select>
    </div>

    <div>
        <input type="checkbox" id="disponibles-seulement">
        <label for="disponibles-seulement">
            Disponibles seulement
        </label>
    </div>

    <div>
        <label for="tri">Trier par :</label>
        <select id="tri">
            <option value="">Aucun tri</option>
            <option value="titre-asc">Titre (A → Z)</option>
            <option value="titre-desc">Titre (Z → A)</option>
            <option value="annee-asc">Année (croissante)</option>
            <option value="annee-desc">Année (décroissante)</option>
        </select>
    </div>

</div>

<p id="nombre-resultats"></p>

<div id="liste-livres">
    <!-- Les livres seront affichés ici avec JavaScript -->
</div>
        </section>

        <section id="ajout">
            <h2>Ajouter un livre</h2>

            <form id="formulaire-livre">

                <div>
                    <label for="titre">Titre :</label>
                   <input
    type="text"
    id="titre"
    name="titre"
    required
    aria-describedby="erreur-titre"
>
<p id="erreur-titre" class="message-erreur" aria-live="polite"></p>
                </div>

                <div>
                    <label for="auteur">Auteur :</label>
                    <input
    type="text"
    id="auteur"
    name="auteur"
    required
    aria-describedby="erreur-auteur"
>
<p id="erreur-auteur" class="message-erreur" aria-live="polite"></p>
                </div>

                <div>
                    <label for="annee">Année :</label>
                    <input
    type="number"
    id="annee"
    name="annee"
    required
    aria-describedby="erreur-annee"
>
<p id="erreur-annee" class="message-erreur" aria-live="polite"></p>
                </div>

                <div>
                    <label for="categorie">Catégorie :</label>
                    <select
    id="categorie"
    name="categorie"
    required
    aria-describedby="erreur-categorie"
>
    <option value="">-- Choisir une catégorie --</option>
    <option value="roman">Roman</option>
    <option value="science">Science</option>
    <option value="histoire">Histoire</option>
    <option value="informatique">Informatique</option>
    <option value="autre">Autre</option>
</select>

<p id="erreur-categorie" class="message-erreur" aria-live="polite"></p>
                </div>

                <div>
                    <input type="checkbox" id="disponible" name="disponible">
                    <label for="disponible">Livre disponible</label>
                </div>

                <button type="submit">Ajouter le livre</button>
<button type="button" id="bouton-reinitialiser">
    Réinitialiser
</button>
            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 - Catalogue de bibliothèque</p>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
